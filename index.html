<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1n Profileeeee</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-rose-50/60 text-slate-700 min-h-screen flex flex-col justify-between selection:bg-rose-300 selection:text-slate-800">

    <!-- Top Navigation / Admin Button -->
    <nav class="max-w-xl mx-auto w-full px-4 pt-6 flex justify-between items-center text-xs font-medium text-slate-500">
        <span class="tracking-widest uppercase text-[10px] text-rose-400 font-semibold">Personal Space</span>
        <button id="admin-toggle-btn" type="button" onclick="toggleAdminModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-rose-200 text-rose-500 hover:bg-rose-100 transition shadow-sm cursor-pointer relative z-10">
            <i class="fa-solid fa-lock text-[10px]"></i> <span id="admin-btn-text">Admin</span>
        </button>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow space-y-8">

        <!-- PROFILE SECTION -->
        <section class="bg-white border border-rose-100 rounded-2xl p-6 shadow-sm text-center relative overflow-hidden">
            <!-- Avatar -->
            <div class="w-24 h-24 mx-auto mb-4 relative">
                <img id="profile-avatar" src="https://yt3.googleusercontent.com/qd0ScliDYW-bjAPjQ0lxoOM9yZpk5vsjjI15ORAynr3v3C6HJ6YK8fgaIuDedgg4TIoaqoc5dg=s160-c-k-c0x00ffffff-no-rj" 
                     alt="Avatar" 
                     class="w-full h-full object-cover rounded-full border-2 border-rose-200 shadow-sm">
            </div>

            <!-- Basic Info -->
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Q1n / Yomako Aiyoru</h1>
            <p class="text-xs text-rose-400 font-medium mb-4">Artist & Writer</p>

            <p class="text-xs text-slate-600 leading-relaxed max-w-md mx-auto bg-rose-50/40 p-3.5 rounded-xl border border-rose-100/60">
                Only she/them. Pansexual. A lazy artist and writer at all times.
            </p>

            <!-- Social Links -->
            <div class="flex justify-center flex-wrap gap-3 mt-5">
                <!-- Facebook -->
                <a href="https://facebook.com/pleasedontDNImeimsosorry" target="_blank" title="Facebook" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-500 flex items-center justify-center text-base transition">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <!-- TikTok -->
                <a href="https://tiktok.com/@imnotgoodpeople14" target="_blank" title="TikTok" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-500 flex items-center justify-center text-base transition">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <!-- X / Twitter -->
                <a href="https://x.com/Coilshotboard1n" target="_blank" title="X (Twitter)" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-500 flex items-center justify-center text-base transition">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <!-- Discord -->
                <div title="Discord: Q1nabc" class="h-9 px-3.5 rounded-full bg-slate-100 text-slate-600 flex items-center gap-1.5 text-xs font-medium border border-transparent hover:border-rose-200 transition">
                    <i class="fa-brands fa-discord text-base"></i>
                    <span>Q1nabc</span>
                </div>
            </div>
        </section>

        <!-- ADMIN POST CREATION PANEL (Hidden by default) -->
        <section id="admin-panel" class="hidden bg-white border border-rose-200 rounded-2xl p-5 shadow-md">
            <div class="flex items-center justify-between mb-3 border-b border-rose-100 pb-2">
                <h3 class="text-xs font-bold text-rose-500 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-nib"></i> Create New Post
                </h3>
                <button type="button" onclick="logoutAdmin()" class="text-[11px] text-slate-400 hover:text-rose-500 underline cursor-pointer">Logout</button>
            </div>
            
            <form id="post-form" onsubmit="createPost(event)" class="space-y-3">
                <input type="text" id="post-title" placeholder="Title (Optional)" 
                       class="w-full text-xs px-3 py-2 rounded-lg bg-rose-50/30 border border-rose-100 focus:outline-none focus:border-rose-300">
                
                <input type="url" id="post-image" placeholder="Image URL (e.g. https://...)" 
                       class="w-full text-xs px-3 py-2 rounded-lg bg-rose-50/30 border border-rose-100 focus:outline-none focus:border-rose-300">
                
                <textarea id="post-content" rows="3" placeholder="Write your thoughts or story plot..." required
                          class="w-full text-xs px-3 py-2 rounded-lg bg-rose-50/30 border border-rose-100 focus:outline-none focus:border-rose-300"></textarea>
                
                <button type="submit" class="w-full py-2 bg-rose-400 hover:bg-rose-500 text-white text-xs font-medium rounded-lg transition shadow-sm cursor-pointer">
                    Publish
                </button>
            </form>
        </section>

        <!-- POSTS / ART GALLERY FEED -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Posts & Artworks</h2>
                <span id="post-count" class="text-[11px] text-rose-400 font-medium">0 items</span>
            </div>

            <div id="posts-container" class="space-y-4">
                <!-- Posts will be rendered here dynamically -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-[11px] text-slate-400 border-t border-rose-100/60">
        <p>© <span id="year"></span> Yuri. All rights reserved.</p>
    </footer>

    <!-- ADMIN LOGIN MODAL WITH CLOSE BUTTON "X" -->
    <div id="login-modal" onclick="handleBackdropClick(event)" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-rose-100 rounded-2xl p-6 max-w-xs w-full shadow-2xl relative">
            <!-- Close Button "X" -->
            <button type="button" onclick="closeAdminModal()" title="Close" class="absolute top-3 right-3 w-7 h-7 flex items-center justify-center rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>

            <h3 class="text-sm font-bold text-slate-800 mb-1 text-center pr-4">Admin Access</h3>
            <p class="text-[11px] text-slate-400 text-center mb-4">Enter credentials to manage posts</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-500 font-medium">ID / Username</label>
                    <input type="text" id="admin-id" required autocomplete="off" placeholder="Enter ID"
                           class="w-full text-xs px-3 py-2 rounded-lg bg-rose-50/40 border border-rose-100 focus:outline-none focus:border-rose-300 mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-medium">Password</label>
                    <input type="password" id="admin-pass" required autocomplete="new-password" placeholder="Enter Password"
                           class="w-full text-xs px-3 py-2 rounded-lg bg-rose-50/40 border border-rose-100 focus:outline-none focus:border-rose-300 mt-1">
                </div>
                <p id="login-error" class="text-[10px] text-red-500 hidden text-center">Invalid ID or Password!</p>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAdminModal()" class="w-1/2 py-1.5 text-xs text-slate-500 hover:bg-slate-100 rounded-lg transition cursor-pointer">Cancel</button>
                    <button type="submit" class="w-1/2 py-1.5 text-xs bg-rose-400 hover:bg-rose-500 text-white font-medium rounded-lg transition cursor-pointer">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const ADMIN_ID = "Coilshotboardmybeloved";
        const ADMIN_PASS = "Heishin0406";

        let isAdmin = false;

        const initialPosts = [
            {
                id: 1,
                title: "Artwork WIP",
                content: "Working on a new illustration project. Digital art sketch in progress.",
                image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=800&auto=format&fit=crop",
                date: "Recent"
            }
        ];

        document.getElementById('year').textContent = new Date().getFullYear();

        // Close Modal on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAdminModal();
            }
        });

        function handleBackdropClick(e) {
            if (e.target.id === 'login-modal') {
                closeAdminModal();
            }
        }

        function getPosts() {
            const saved = localStorage.getItem('yuri_posts_v5');
            if (!saved) {
                localStorage.setItem('yuri_posts_v5', JSON.stringify(initialPosts));
                return initialPosts;
            }
            return JSON.parse(saved);
        }

        function renderPosts() {
            const posts = getPosts();
            const container = document.getElementById('posts-container');
            document.getElementById('post-count').textContent = `${posts.length} items`;

            if (posts.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">No posts yet.</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                let titleHtml = post.title ? `<h3 class="text-sm font-semibold text-slate-800">${escapeHtml(post.title)}</h3>` : '';
                let imageHtml = post.image ? `
                    <div class="rounded-xl overflow-hidden border border-rose-100 max-h-80 bg-rose-50/20">
                        <img src="${escapeHtml(post.image)}" alt="Post image" class="w-full h-full object-cover">
                    </div>
                ` : '';
                let deleteBtn = isAdmin ? `
                    <button type="button" onclick="deletePost(${post.id})" class="text-rose-400 hover:text-rose-600 font-medium cursor-pointer">
                        <i class="fa-regular fa-trash-can"></i> Delete
                    </button>
                ` : '';

                return `
                    <article class="bg-white border border-rose-100 rounded-2xl p-5 shadow-sm space-y-3">
                        ${titleHtml}
                        ${imageHtml}
                        <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${escapeHtml(post.content)}</p>
                        <div class="flex items-center justify-between text-[10px] text-slate-400 pt-2 border-t border-rose-50">
                            <span>${post.date}</span>
                            ${deleteBtn}
                        </div>
                    </article>
                `;
            }).join('');
        }

        function toggleAdminModal() {
            const modal = document.getElementById('login-modal');
            if (isAdmin) {
                document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
            } else {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeAdminModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleLogin(e) {
            e.preventDefault();
            const idInput = document.getElementById('admin-id').value.trim();
            const passInput = document.getElementById('admin-pass').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (idInput === ADMIN_ID && passInput === ADMIN_PASS) {
                isAdmin = true;
                errorMsg.classList.add('hidden');
                closeAdminModal();
                
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-btn-text').textContent = 'Admin Mode';
                document.getElementById('admin-toggle-btn').classList.add('bg-rose-200', 'text-rose-700');

                renderPosts();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-btn-text').textContent = 'Admin';
            document.getElementById('admin-toggle-btn').classList.remove('bg-rose-200', 'text-rose-700');
            renderPosts();
        }

        function createPost(e) {
            e.preventDefault();
            const title = document.getElementById('post-title').value.trim();
            const image = document.getElementById('post-image').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!content) return;

            const posts = getPosts();
            const newPost = {
                id: Date.now(),
                title: title,
                image: image,
                content: content,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            };

            posts.unshift(newPost);
            localStorage.setItem('yuri_posts_v5', JSON.stringify(posts));

            document.getElementById('post-form').reset();
            renderPosts();
        }

        function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            let posts = getPosts();
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('yuri_posts_v5', JSON.stringify(posts));
            renderPosts();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        renderPosts();
    </script>
</body>
</html>
